name: Gunluk PusulaSpor AI Bulteni

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  bulten-gonder:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Cek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutuphaneleri Yukle
        run: pip install requests google-genai

      - name: Bulteni Calistir ve Telegrama Gonder
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python otomatik_bulten.py
